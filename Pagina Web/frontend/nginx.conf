server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 6m;
    # Trust only the configured HTTPS ingress, never arbitrary forwarded headers.
    set_real_ip_from ${TRUSTED_INGRESS_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # Docker's embedded DNS resolves the configured service on each cache expiry.
    # nginx can start before the API exists and recover after an API replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $tickia_api_upstream "${API_UPSTREAM}";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.culqi.com https://js.culqi.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; frame-src https://*.culqi.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Preserve /api in the upstream URI, with same-origin session cookies.
    location /api/ {
        proxy_pass $tickia_api_upstream;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Tickia-Client-IP $remote_addr;
        proxy_set_header X-Tickia-Proxy-Secret "${PROXY_SHARED_SECRET}";
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass $tickia_api_upstream;
    }
    location = /ready {
        proxy_pass $tickia_api_upstream;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location /brand/ {
        expires 1d;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
