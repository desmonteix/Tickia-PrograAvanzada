services:
  - type: web
    name: tickertrader-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: QR_ENCRYPTION_KEY
        sync: false
      - key: QR_HMAC_SECRET
        sync: false
      - key: CULQI_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_PROD_URL
        sync: false
