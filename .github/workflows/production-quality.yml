name: Production quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pagina Web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Pagina Web/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: /api

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tickia
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: tickia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Pagina Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Pagina Web/backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt -r tests/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s backend/tests -v
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://tickia:isolated-ci-password@localhost:5432/tickia_test
      - run: python -m bandit -r backend -x backend/venv,backend/tests -ll
      - run: python -m pip_audit -r backend/requirements.txt

  browser:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    defaults:
      run:
        working-directory: Pagina Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Pagina Web/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Pagina Web/backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: python -m pip install -r backend/requirements.txt -r tests/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m unittest discover -s tests/e2e -v
        env:
          TICKIA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: Pagina Web/test-results

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tickia-api './Pagina Web/backend'
      - run: docker run --rm --entrypoint python tickia-api -c 'import cv2, bcrypt, sqlalchemy, cryptography'
      - run: docker build -t tickia-web './Pagina Web/frontend'
      - run: docker run --rm -e API_UPSTREAM=http://127.0.0.1:8000 tickia-web sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
